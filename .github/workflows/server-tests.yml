name: Server Tests

on:
  push:
    paths: ['server/**']
  pull_request:
    paths: ['server/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 只装测试需要的轻量依赖（不装 yue2-infer/torch：真模型路径在 GPU 机器验证）
      - name: Install test dependencies
        run: python -m pip install --upgrade pip fastapi uvicorn soundfile pytest httpx

      - name: Run server tests (stub 模式)
        run: cd server && python -m pytest tests -q
        env:
          YUE2_STUB: '1'
          YUE2_STUB_FAST: '1'
