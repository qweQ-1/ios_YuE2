name: YuE2Studio
options:
  bundleIdPrefix: com.qweq-1
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  YuE2Studio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YuE2Studio
    info:
      path: YuE2Studio/Info.plist
      properties:
        CFBundleDisplayName: "YuE2 Studio"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        # 自建服务器常在局域网用 http://，放行任意加载
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.yue2studio
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"

  YuE2StudioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YuE2StudioTests
    dependencies:
      - target: YuE2Studio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.yue2studio.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YuE2Studio.app/YuE2Studio"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  YuE2Studio:
    build:
      targets:
        YuE2Studio: all
        YuE2StudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YuE2StudioTests
